<!-- Official DevFest Kivu 3D T-Shirt Showcase Section -->
<section class="py-16 md:py-24 bg-white relative overflow-hidden border-b border-gray-100" id="tshirt">
  <!-- Subtle ambient decorative glow matching site design tokens -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
    <div class="hidden md:block absolute -top-24 -right-24 w-80 h-80 bg-primary/10 rounded-full blur-3xl"></div>
    <div class="hidden md:block absolute -bottom-24 -left-24 w-80 h-80 bg-secondary/10 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 relative z-10 w-full">
    <!-- Mobile-only Title (placed above the 3D T-shirt on mobile) -->
    <div class="block md:hidden mb-6 text-left">
      <h2 class="text-3xl font-extrabold text-text tracking-tight leading-tight">
        Le T-Shirt Officiel <span class="text-primary block sm:inline">DevFest Kivu</span>
      </h2>
    </div>

    <!-- 2-Column Responsive Grid: 50% / 50% on tablet & desktop -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 lg:gap-16 items-center w-full">
      
      <!-- Left Column: 3D Model Viewer Card (without shadow) -->
      <div class="w-full min-w-0">
        <div class="relative bg-gradient-to-b from-gray-50/90 to-gray-100/60 rounded-3xl p-4 sm:p-6 border border-gray-200/80">
          
          <!-- Model-Viewer Custom Element -->
          <model-viewer
            #modelViewer
            src="assets/models/tshirt.glb"
            poster="assets/t-shirt.png"
            loading="lazy"
            reveal="auto"
            alt="T-shirt Officiel DevFest Kivu"
            auto-rotate
            camera-controls
            touch-action="pan-y"
            shadow-intensity="1.5"
            shadow-softness="0.8"
            exposure="1"
            interaction-prompt="auto"
            class="h-[380px] sm:h-[420px] md:h-[460px] w-full max-w-full block bg-transparent focus:outline-none"
          ></model-viewer>

          <!-- Label indicating the official t-shirt -->
          <p class="mt-3 text-center text-xs sm:text-sm text-text-muted font-medium select-none">
            T-shirt Officiel DevFest Kivu
          </p>
        </div>
      </div>

      <!-- Right Column: Product Presentation & Call to Action (Left-aligned on all screen sizes) -->
      <div class="w-full min-w-0 flex flex-col gap-6 text-left">
        <!-- Desktop-only Title -->
        <h2 class="hidden md:block md:order-1 text-3xl sm:text-4xl lg:text-5xl font-extrabold text-text tracking-tight leading-tight">
          Le T-Shirt Officiel <span class="text-primary block sm:inline">DevFest Kivu</span>
        </h2>

        <!-- Front and Back Figures: order-1 on mobile (above text), order-3 on desktop (under text) -->
        <div class="order-1 md:order-3 flex items-center justify-start gap-4">
          <!-- Front view thumbnail -->
          <button
            type="button"
            (click)="setView('0deg 75deg 105%')"
            class="thumbnail-btn group flex flex-col items-center gap-1.5 cursor-pointer focus:outline-none"
            title="Voir la face avant"
          >
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gray-50 border border-gray-200/80 p-1.5 flex items-center justify-center overflow-hidden transition-all duration-200 cursor-pointer group-hover:border-primary group-hover:scale-105">
              <img
                src="assets/models/t-shirt_front.png"
                alt="Face avant du t-shirt"
                class="w-full h-full object-contain pointer-events-none"
                loading="lazy"
              />
            </div>
            <span class="text-[11px] sm:text-xs font-medium text-text-muted cursor-pointer group-hover:text-primary transition-colors">
              Face avant
            </span>
          </button>

          <!-- Back view thumbnail -->
          <button
            type="button"
            (click)="setView('180deg 75deg 105%')"
            class="thumbnail-btn group flex flex-col items-center gap-1.5 cursor-pointer focus:outline-none"
            title="Voir la face arrière"
          >
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gray-50 border border-gray-200/80 p-1.5 flex items-center justify-center overflow-hidden transition-all duration-200 cursor-pointer group-hover:border-primary group-hover:scale-105">
              <img
                src="assets/models/t-shirt_back.png"
                alt="Face arrière du t-shirt"
                class="w-full h-full object-contain pointer-events-none"
                loading="lazy"
              />
            </div>
            <span class="text-[11px] sm:text-xs font-medium text-text-muted cursor-pointer group-hover:text-primary transition-colors">
              Face arrière
            </span>
          </button>
        </div>

        <!-- Description text: order-2 on mobile (under thumbnails) and order-2 on desktop (under title) -->
        <p class="order-2 md:order-2 text-base sm:text-lg text-text-muted leading-relaxed">
          Procurez-vous le t-shirt officiel du DevFest Kivu et affichez les couleurs de la communauté tech.
        </p>

        <!-- Call to Action Button: order-3 on mobile, order-4 on desktop -->
        <div class="order-3 md:order-4 pt-1 flex items-center justify-start">
          <button
            type="button"
            (click)="navigateToOrder()"
            class="btn btn-primary group px-6 py-3.5 text-base font-semibold shadow-md inline-flex items-center justify-center w-auto"
          >
            <span>Commander mon T-Shirt</span>
            <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</section>
